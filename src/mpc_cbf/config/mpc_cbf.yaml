    pixel_measurement_std: 6.0
    depth_measurement_std: 0.1
    pixel_process_std: 100.0
    depth_process_std: 0.1
    initial_pixel_velocity_std: 25.0
    initial_depth_velocity_std: 1.0
    use_sim_time: true
    detector_weights: /home/dahalc1/tracking_ws_backup/src/human_tracking/human_tracking/Yolo-weights/yolov8n.pt
    inference_image_size: 640
